version: '3.8'

services:
  # MySQL 数据库
#使用本地数据库

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: pet-adoption-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass redis_password
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - pet-network

  # 后端应用服务
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: pet-adoption-backend
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - GIN_MODE=release
      - TZ=Asia/Shanghai
    volumes:
      - ../logs:/root/logs
      - ../config:/root/config
    networks:
      - pet-network

  # 前端应用服务
  frontend:
    build:
      context: ../web
      dockerfile: Dockerfile
    container_name: pet-adoption-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - pet-network

volumes:
  mysql_data:
  redis_data:

networks:
  pet-network:
    driver: bridge
